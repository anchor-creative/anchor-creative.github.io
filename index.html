<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Games</title>
<style>:root{color-scheme:light dark;--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#66645e;--line:#dfddd5;--accent:#0b6e4f}@media (prefers-color-scheme:dark){:root{--bg:#171715;--card:#22221f;--ink:#f2f0ea;--mute:#a8a59c;--line:#3a3934;--accent:#5fd3a8}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}main{max-width:720px;margin:0 auto;padding:48px 16px}h1{font-size:2rem;margin:0 0 8px}p{color:var(--mute);margin:0 0 24px}a.card{display:block;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;margin-bottom:12px}a.card:hover{border-color:var(--accent)}a.card strong{display:block}a.card span{color:var(--mute);font-size:.95rem}button{font:inherit;font-size:1.25rem;padding:16px 28px;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);cursor:pointer}.big{font-size:4rem;font-weight:700;margin:16px 0}.back{display:inline-block;margin-bottom:24px;color:var(--accent)}</style>
</head>
<body>
<main>
<h1>My Games</h1>
<p>Things I have made.</p>
<!-- To add a game, copy the three lines below and change the link and text. -->
<a class="card" href="games/click-counter/">
  <strong>Click Counter</strong><span>A tiny example game. Replace me.</span>
</a>
</main>
</body>
</html>
