<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playground World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ui-bg:#ffffff; --ui-fg:#33303f; --ui-accent:#ff7a3d; --ui-shadow:rgba(40,30,60,.25); --page:#9fdcf2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ui-bg:#2b2a36;--ui-fg:#f4f2fa;--ui-accent:#ff8d55;--ui-shadow:rgba(0,0,0,.55);--page:#16202b;color-scheme:dark}
}
:root[data-theme="dark"]{--ui-bg:#2b2a36;--ui-fg:#f4f2fa;--ui-accent:#ff8d55;--ui-shadow:rgba(0,0,0,.55);--page:#16202b;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100%;background:var(--page);color:var(--ui-fg);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#viewport{position:relative;height:100%;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none}
#viewport::-webkit-scrollbar{display:none}
#spacer{position:relative;height:100%}
#world{position:absolute;left:0;top:0;height:800px;transform-origin:0 0}
.scene{position:absolute;left:0;top:0;height:800px;display:none}
.scene.active{display:block}
.scene .bg{display:block;width:100%;height:100%}

.item,.spot{position:absolute;pointer-events:none}
.item{touch-action:none}
.item .art,.spot .art{position:relative;width:100%;height:100%;transform-origin:50% 100%;transition:transform .16s ease,filter .16s ease}
.item svg,.spot svg{width:100%;height:100%;display:block;overflow:visible}
.item svg *{pointer-events:visiblePainted;touch-action:none;cursor:grab}
.spot svg *{pointer-events:visiblePainted;touch-action:pan-x;cursor:pointer}
.shadow{position:absolute;left:20%;right:20%;bottom:-7px;height:14px;border-radius:50%;
  background:rgba(30,45,20,.22);transition:transform .16s ease,opacity .16s ease}
.item.lifted .art{transform:translateY(-18px) scale(1.07)}
.item.lifted .shadow{transform:scale(.75);opacity:.55}
.item.lifted svg *{cursor:grabbing}
.item.hop .art{animation:hop .5s ease}
.item.wiggle .art,.spot.press .art{animation:wiggle .45s ease}
.item.land .art{animation:land .28s ease}
.item.stored{display:none}
.puff{position:absolute;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:#fff;border:3px solid #3b2b2b;
  pointer-events:none;animation:floatUp 1.4s ease-out forwards;z-index:99999}
.spot.target .art{transform:scale(1.05);filter:drop-shadow(0 0 16px #fff4a0) drop-shadow(0 0 6px #ffd23f)}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-46px) scaleY(1.04)}70%{transform:translateY(0) scaleY(.92)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes land{0%{transform:scaleY(.9) scaleX(1.06)}100%{transform:none}}

.note{position:absolute;font-size:44px;pointer-events:none;animation:floatUp 1.6s ease-out forwards;z-index:99999}
@keyframes floatUp{0%{opacity:0;transform:translate(0,0) rotate(-10deg)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-160px) rotate(12deg)}}

.btn{position:fixed;width:54px;height:54px;border-radius:50%;border:none;background:var(--ui-bg);color:var(--ui-fg);
  box-shadow:0 4px 0 var(--ui-shadow);font:inherit;font-size:24px;display:grid;place-items:center;cursor:pointer;z-index:10;
  transition:transform .15s ease,background .15s ease}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ui-shadow)}
.btn:focus-visible,.card button:focus-visible{outline:3px solid var(--ui-accent);outline-offset:3px}
.btn svg{width:28px;height:28px}
.btn.target{background:var(--ui-accent);color:#fff;transform:scale(1.15)}
#town{top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 14px)}
#reset{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px)}
.hidden{display:none !important}
#place{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 20px);
  background:var(--ui-bg);color:var(--ui-fg);padding:8px 20px;border-radius:999px;font-size:18px;font-weight:600;
  box-shadow:0 4px 0 var(--ui-shadow);z-index:10;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);
  background:var(--ui-bg);color:var(--ui-fg);padding:10px 20px;border-radius:999px;font-size:16px;font-weight:500;
  box-shadow:0 4px 0 var(--ui-shadow);z-index:20;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.gaming .scene .item,body.gaming .scene .spot,body.gaming > .btn,body.gaming #place{opacity:0;pointer-events:none}
#game{position:fixed;inset:0;z-index:50;display:none;touch-action:none}
#game.on{display:block}
#game canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.g-score{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);
  font-size:64px;font-weight:600;color:#fff;text-shadow:0 3px 0 #3b2b2b,0 -2px 0 #3b2b2b,2px 0 0 #3b2b2b,-2px 0 0 #3b2b2b;pointer-events:none}
.g-msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:var(--ui-bg);color:var(--ui-fg);
  padding:10px 20px;border-radius:999px;font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--ui-shadow);pointer-events:none;white-space:nowrap}
#gclose{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);z-index:52}
.g-over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,40,60,.25);z-index:51}
.card{background:var(--ui-bg);color:var(--ui-fg);border-radius:28px;padding:26px 30px;text-align:center;
  box-shadow:0 6px 0 var(--ui-shadow);min-width:260px;max-width:90vw}
.card h2{margin:0 0 4px;font-size:28px;font-weight:600}
.card p{margin:0 0 18px;font-size:18px;font-weight:500;opacity:.8}
.card button{display:block;width:100%;border:none;border-radius:999px;font:inherit;font-size:18px;font-weight:600;
  padding:12px 18px;margin-top:10px;cursor:pointer;background:var(--ui-accent);color:#fff;box-shadow:0 4px 0 var(--ui-shadow)}
.card button.alt{background:transparent;color:var(--ui-fg);box-shadow:none;border:2px solid currentColor}
#builder{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#86cdf0;overflow:hidden}
#builder.on{display:flex}
.b-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) 8px calc(env(safe-area-inset-left,0px) + 14px)}
.b-title{font-size:22px;font-weight:600;color:#fff;text-align:center;
  text-shadow:0 3px 0 #3b2b2b,0 -2px 0 #3b2b2b,2px 0 0 #3b2b2b,-2px 0 0 #3b2b2b}
.pill{border:none;border-radius:999px;font:inherit;font-size:17px;font-weight:600;padding:10px 18px;min-width:84px;
  background:var(--ui-bg);color:var(--ui-fg);box-shadow:0 4px 0 var(--ui-shadow);cursor:pointer}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ui-shadow)}
.pill.accent{background:var(--ui-accent);color:#fff}
.pill:focus-visible{outline:3px solid #fff;outline-offset:3px}
.b-stage{position:relative;flex:1;min-height:0}
#bsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none}
.bp{cursor:grab;touch-action:none}
.bp.lifted{cursor:grabbing;filter:drop-shadow(0 10px 4px rgba(80,60,20,.28))}
.b-hint{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--ui-bg);color:var(--ui-fg);
  padding:10px 20px;border-radius:999px;font-size:17px;font-weight:600;box-shadow:0 4px 0 var(--ui-shadow);
  pointer-events:none;white-space:nowrap;transition:opacity .3s}
.b-tray{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--ui-bg);
  border-radius:26px 26px 0 0;box-shadow:0 -4px 0 var(--ui-shadow)}
.b-tray::after{content:'Drop here to put it away';position:absolute;inset:0;display:none;place-items:center;
  font-size:20px;font-weight:600;color:#fff;background:#ff6b6b;border-radius:inherit}
.b-tray.over::after{display:grid}
.b-piece{width:58px;height:58px;border:none;border-radius:16px;background:#fff3d2;padding:6px;cursor:grab;
  touch-action:none;box-shadow:0 3px 0 rgba(60,40,10,.18)}
.b-piece:focus-visible{outline:3px solid var(--ui-accent);outline-offset:2px}
.b-piece svg{width:100%;height:100%;display:block;overflow:visible}
@media (max-width:520px){.b-piece{width:50px;height:50px;padding:5px}.b-title{font-size:18px}.pill{min-width:70px;padding:9px 14px;font-size:15px}}
#ppwrap{position:fixed;inset:0;z-index:50;display:none;touch-action:none}
#ppwrap.on{display:block}
#ppwrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#ppclose{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);z-index:52}
.pp-time{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);
  width:min(60vw,320px);height:16px;border-radius:999px;background:rgba(255,255,255,.7);border:3px solid #3b2b2b;overflow:hidden;pointer-events:none}
#ppbar{height:100%;width:100%;background:#ffd23f}
.item.eaten{display:none}
.item.banked{display:none}
#dress{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:radial-gradient(circle at 30% 40%,#fff6fb,#ffd9ea 70%)}
#dress.on{display:flex}
#dress .b-title{color:#3b2b2b;text-shadow:none}
.dx-body{flex:1;min-height:0;display:flex;gap:12px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.dx-preview{flex:0 0 38%;position:relative;min-height:0}
.dx-preview::after{content:'';position:absolute;left:15%;right:15%;bottom:6%;height:18px;border-radius:50%;background:rgba(120,40,80,.15)}
.dx-preview svg{position:absolute;left:4%;top:12%;width:92%;height:80%;overflow:visible;z-index:1}
.dx-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--ui-bg);border-radius:24px;box-shadow:0 4px 0 var(--ui-shadow);overflow:hidden}
.dx-tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;scrollbar-width:none;border-bottom:3px solid rgba(0,0,0,.06)}
.dx-tabs::-webkit-scrollbar{display:none}
.dx-tab{border:none;border-radius:999px;padding:9px 16px;font:inherit;font-size:16px;font-weight:600;background:rgba(0,0,0,.06);color:var(--ui-fg);cursor:pointer;white-space:nowrap}
.dx-tab.on{background:var(--ui-accent);color:#fff}
.dx-opts{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.dx-row{display:flex;flex-wrap:wrap;gap:10px}
.dx-label{font-size:15px;font-weight:600;opacity:.7}
.dx-sw{width:46px;height:46px;border-radius:50%;border:4px solid #3b2b2b;cursor:pointer;padding:0}
.dx-chip{border:3px solid #3b2b2b;border-radius:14px;padding:8px 14px;font:inherit;font-size:16px;font-weight:600;background:#fff;color:#3b2b2b;cursor:pointer}
.dx-icon{width:74px;height:74px;border:3px solid #3b2b2b;border-radius:16px;background:#fff;cursor:pointer;padding:6px;display:grid;place-items:center;font:inherit;font-size:13px;font-weight:600;color:#3b2b2b}
.dx-icon svg{width:100%;height:100%;overflow:visible}
.dx-sw.on,.dx-chip.on,.dx-icon.on{box-shadow:0 0 0 4px var(--ui-accent);transform:scale(1.06)}
.dx-sw:focus-visible,.dx-chip:focus-visible,.dx-icon:focus-visible,.dx-tab:focus-visible{outline:3px solid var(--ui-accent);outline-offset:3px}
@media (orientation:portrait){.dx-body{flex-direction:column}.dx-preview{flex:0 0 36%}}
.want{position:absolute;left:50%;top:-30%;width:100px;height:86px;margin-left:-50px;background:#fff;border:4px solid #3b2b2b;border-radius:42px;
  display:grid;place-items:center;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.15);animation:wantbob 2.4s ease-in-out infinite}
.want::after{content:'';position:absolute;bottom:-16px;left:30px;width:16px;height:16px;background:#fff;border:4px solid #3b2b2b;border-radius:50%}
.want svg{width:66%;height:66%;overflow:visible}
@keyframes wantbob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.want{animation:none}}
#mem{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#fdf0d5}
#mem.on{display:flex}
.m-moves{font-size:17px;font-weight:600;color:#fff;background:#3fa9f5;padding:10px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2);min-width:84px;text-align:center;white-space:nowrap}
.m-grid{position:relative;flex:1;min-height:0;display:grid;gap:12px;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 16px);align-content:center;justify-content:center}
.m-card{perspective:800px;cursor:pointer;border:none;background:none;padding:0;font:inherit}
.m-card:focus-visible{outline:4px solid var(--ui-accent);outline-offset:3px;border-radius:18px}
.m-inner{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d}
.m-card.up .m-inner{transform:rotateY(180deg)}
.m-face{position:absolute;inset:0;border-radius:16px;border:4px solid #3b2b2b;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.m-back{background:#b48cff}
.m-back svg{width:46%;height:46%}
.m-front{background:#fff;transform:rotateY(180deg)}
.m-front svg{width:72%;height:72%;overflow:visible}
.m-card.matched .m-front{background:#dcffe6}
.m-card.matched .m-inner{animation:mpop .45s ease}
@keyframes mpop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
#mem .b-title{color:#3b2b2b;text-shadow:none}
@media (prefers-reduced-motion:reduce){.m-inner{transition:none}.m-card.matched .m-inner{animation:none}}
#draw{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#6b4a36}
#draw.on{display:flex}
#draw.easel{background:#fbe3d6}
.d-stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:8px}
#dcanvas{border:12px solid #a0673f;border-radius:10px;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:crosshair;display:block}
.d-tray{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--ui-bg);border-radius:26px 26px 0 0;box-shadow:0 -4px 0 var(--ui-shadow)}
.d-sw{width:46px;height:46px;border-radius:50%;border:4px solid #3b2b2b;cursor:pointer;padding:0;transition:transform .12s}
.d-sw.on{transform:scale(1.18);box-shadow:0 0 0 4px var(--ui-accent)}
.d-sw:focus-visible{outline:3px solid var(--ui-accent);outline-offset:3px}
.d-erase{width:auto;border-radius:14px;padding:0 14px;background:#fff;font:inherit;font-size:16px;font-weight:600;color:#3b2b2b}
.swingseat{position:absolute;left:70px;top:30px;width:120px;height:252px;transform-origin:60px 0}
.swingseat svg{width:100%;height:100%;display:block;overflow:visible}
.crumb{position:absolute;width:11px;height:11px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #3b2b2b;pointer-events:none;z-index:99999;
  animation:crumb .7s ease-in forwards}
@keyframes crumb{100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.pop-text{position:absolute;width:200px;margin-left:-100px;text-align:center;font-size:38px;font-weight:600;color:#fff;white-space:nowrap;
  text-shadow:0 3px 0 #3b2b2b,0 -2px 0 #3b2b2b,2px 0 0 #3b2b2b,-2px 0 0 #3b2b2b;pointer-events:none;z-index:99999;animation:floatUp 1.3s ease-out forwards}
@media (prefers-reduced-motion:reduce){.item .art,.shadow,.spot .art{transition:none}.item.hop .art,.item.wiggle .art,.item.land .art,.spot.press .art{animation:none}}
</style>
</head>
<body>
<div id="viewport"><div id="spacer"><div id="world"></div></div></div>
<button class="btn hidden" id="town" aria-label="Back to town">
  <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4 13 L14 4 L24 13"/><path d="M7 11 V24 H21 V11"/><path d="M12 24 V17 H16 V24"/></svg>
</button>
<button class="btn" id="reset" aria-label="Put everything back">↺</button>
<div id="place">Town</div>
<div class="toast" id="toast"></div>

<div id="game" aria-label="Keepy-uppy game">
  <canvas id="gcanvas"></canvas>
  <div class="g-score" id="gscore">0</div>
  <div class="g-msg" id="gmsg">Tap the ball to keep it up!</div>
  <button class="btn" id="gclose" aria-label="Stop playing">✕</button>
  <div class="g-over hidden" id="gover">
    <div class="card">
      <h2 id="gtitle">Splash!</h2>
      <p id="gtext"></p>
      <button id="gagain">Play again</button>
      <button class="alt" id="gdone">Back to the beach</button>
    </div>
  </div>
</div>

<div id="ppwrap" aria-label="Bubble pop game">
  <canvas id="ppcanvas"></canvas>
  <div class="g-score" id="ppscore">0</div>
  <div class="pp-time"><div id="ppbar"></div></div>
  <div class="g-msg" id="ppmsg">Pop as many bubbles as you can!</div>
  <button class="btn" id="ppclose" aria-label="Stop playing">✕</button>
  <div class="g-over hidden" id="ppover">
    <div class="card">
      <h2 id="pptitle">Time’s up!</h2>
      <p id="pptext"></p>
      <button id="ppagain">Play again</button>
      <button class="alt" id="ppdone">Back to the park</button>
    </div>
  </div>
</div>

<div id="dress" aria-label="Dress up">
  <div class="b-top">
    <button class="pill" id="dxcancel">Cancel</button>
    <div class="b-title" id="dxtitle">Dress up</div>
    <button class="pill accent" id="dxdone">Done</button>
  </div>
  <div class="dx-body">
    <div class="dx-preview" id="dxprev"></div>
    <div class="dx-panel"><div class="dx-tabs" id="dxtabs"></div><div class="dx-opts" id="dxopts"></div></div>
  </div>
</div>

<div id="mem" aria-label="Memory match game">
  <div class="b-top">
    <div class="m-moves" id="mmoves">Goes: 0</div>
    <div class="b-title">Memory match</div>
    <button class="pill" id="mclose">Done</button>
  </div>
  <div class="m-grid" id="mgrid"></div>
  <div class="g-over hidden" id="mover">
    <div class="card">
      <h2 id="mtitle">Well done!</h2>
      <p id="mtext"></p>
      <button id="magain">Play again</button>
      <button class="alt" id="mdone">Back to class</button>
    </div>
  </div>
</div>

<div id="draw" aria-label="Drawing">
  <div class="b-top">
    <button class="pill" id="dclear">Clear</button>
    <div class="b-title" id="dtitle">Draw on the board</div>
    <button class="pill accent" id="ddone">Done</button>
  </div>
  <div class="d-stage"><canvas id="dcanvas"></canvas></div>
  <div class="d-tray" id="dtray"></div>
</div>

<div id="builder" aria-label="Sandcastle builder">
  <div class="b-top">
    <button class="pill" id="bclear">Clear</button>
    <div class="b-title">Build a sandcastle</div>
    <button class="pill accent" id="bdone">Done</button>
  </div>
  <div class="b-stage">
    <svg id="bsvg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <rect x="-1500" y="-1500" width="3600" height="1660" fill="#86cdf0"/>
      <circle cx="520" cy="62" r="34" fill="#ffd84d" stroke="#3b2b2b" stroke-width="3"/>
      <ellipse cx="140" cy="70" rx="60" ry="18" fill="#fff"/><ellipse cx="170" cy="56" rx="34" ry="18" fill="#fff"/>
      <rect x="-1500" y="150" width="3600" height="80" fill="#3dbfcb"/>
      <rect x="-1500" y="150" width="3600" height="16" fill="#6fd6dc"/>

/* ---------- characters ---------- */

const HATS = {

  star: `<g fill="none" stroke-width="4" stroke-linejoin="round"><path d="M46 63 l4 8 9 1 -6.5 6 1.5 9 -8 -4.5 -8 4.5 1.5 -9 -6.5 -6 9 -1Z" stroke="#ff5d7a" fill="rgba(255,93,122,.25)"/><path d="M74 63 l4 8 9 1 -6.5 6 1.5 9 -8 -4.5 -8 4.5 1.5 -9 -6.5 -6 9 -1Z" stroke="#ffd23f" fill="rgba(255,210,63,.25)"/></g>`,

function extras(o, tb) {
  const back = o.cape ? `<path d="M40 106 Q60 98 80 106 L106 ${tb + 34} Q60 ${tb + 48} 14 ${tb + 34}Z" fill="${o.cape}" ${S()}/>` : '';

  if (o.specs && SPECS[o.specs]) front += SPECS[o.specs];

}
function kid(o) {
  const h = o.hair, sk = o.skin;
  let back = '', front = '';
  const c = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${h}" ${S()}/>`;
  if (o.style === 'curly') {
    back = [[22,74,20],[98,74,20],[20,102,17],[100,102,17],[28,124,14],[92,124,14]].map(a => c(...a)).join('');

  } else if (o.style === 'pony') {
    back = `<path d="M88 44 Q130 52 122 104 Q118 132 100 142 Q108 110 96 86Z" fill="${h}" ${S()}/>`;

             <circle cx="94" cy="48" r="7" fill="${o.tie}" ${S(3)}/>`;
  } else {
    front = `<path d="M21 74 Q18 24 60 24 Q102 24 99 74 Q96 54 86 48 Q74 58 56 50 Q36 52 21 74Z" fill="${h}" ${S()}/>`;
  }
  const legFill = o.bottomType === 'trousers' ? o.bottom : sk;
  let lower = `<rect x="43" y="158" width="14" height="46" rx="6" fill="${legFill}" ${S()}/>
               <rect x="63" y="158" width="14" height="46" rx="6" fill="${legFill}" ${S()}/>`;
  if (o.socks) lower += `<rect x="43" y="186" width="14" height="14" fill="${o.socks}" ${S(3)}/><rect x="63" y="186" width="14" height="14" fill="${o.socks}" ${S(3)}/>`;

  if (o.bottomType === 'skirt') lower += `<path d="M36 150 L84 150 L92 182 Q60 190 28 182Z" fill="${o.bottom}" ${S()}/>`;
  if (o.bottomType === 'shorts') lower += `<path d="M36 150 H84 L87 182 H64 L60 170 L56 182 H33Z" fill="${o.bottom}" ${S()}/>`;
  if (o.bottomType === 'trousers') lower += `<path d="M36 150 H84 L80 166 H40Z" fill="${o.bottom}" ${S()}/>`;
  const arm = d => `<path d="${d}" fill="none" stroke="${OL}" stroke-width="19" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.top}" stroke-width="11" stroke-linecap="round"/>`;
  const body = arm('M40 114 Q26 130 27 154') + arm('M80 114 Q94 130 93 154') +
    `<path d="M36 116 Q38 102 60 102 Q82 102 84 116 L88 160 Q60 168 32 160Z" fill="${o.top}" ${S()}/>` +
    (o.collar ? `<path d="M50 104 L60 117 L70 104Z" fill="${o.collar}" ${S(3)}/>` : '') +
    (o.badge ? `<circle cx="70" cy="132" r="7" fill="${o.badge}" ${S(3)}/>` : '') +
    `<circle cx="27" cy="160" r="8" fill="${sk}" ${S()}/><circle cx="93" cy="160" r="8" fill="${sk}" ${S()}/>`;
  const face = `<circle cx="60" cy="70" r="38" fill="${sk}" ${S()}/>` + front +
    `<ellipse cx="46" cy="77" rx="4.5" ry="6" fill="#2a1d1d"/><circle cx="47.6" cy="74.4" r="1.7" fill="#fff"/>
     <ellipse cx="74" cy="77" rx="4.5" ry="6" fill="#2a1d1d"/><circle cx="75.6" cy="74.4" r="1.7" fill="#fff"/>
     <circle cx="35" cy="89" r="6.5" fill="#ff7f7f" opacity=".42"/><circle cx="85" cy="89" r="6.5" fill="#ff7f7f" opacity=".42"/>
     <path d="M53 93 Q60 100 67 93" fill="none" ${S(3)}/>` +

  const ex = extras(o, 160);

}

function person(o) {
  const [tb, lt, lb, HH] = { kid: [160, 158, 204, 216], adult: [186, 182, 252, 264], baby: [148, 144, 166, 180] }[o.type || 'kid'];
  const h = o.hair, sk = o.skin;
  const hc = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${h}" ${S()}/>`;
  const cap = `<path d="M21 76 Q16 24 60 24 Q104 24 99 76 Q92 50 60 48 Q28 50 21 76Z" fill="${h}" ${S()}/>`;
  let back = '', front = '';
  if (o.style === 'long') {
    back = `<path d="M22 70 Q16 24 60 24 Q104 24 98 70 L106 ${tb - 24} Q60 ${tb - 8} 14 ${tb - 24}Z" fill="${h}" ${S()}/>`; front = cap;
  } else if (o.style === 'bun') {
    back = hc(60, 24, 18);
    front = `<path d="M22 76 Q18 28 60 28 Q102 28 98 76 Q92 46 60 44 Q28 46 22 76Z" fill="${h}" ${S()}/>`;
  } else if (o.style === 'afro') {
    for (let a = 150; a <= 390; a += 24) { const r = a * Math.PI / 180; back += hc(f(60 + 42 * Math.cos(r)), f(64 + 40 * Math.sin(r)), 19); }
    front = `<path d="M24 66 Q22 28 60 26 Q98 28 96 66 Q86 48 60 46 Q34 48 24 66Z" fill="${h}"/>`;
  } else if (o.style === 'spiky') {
    front = `<path d="M22 72 L16 44 L30 50 L30 26 L44 40 L52 16 L62 36 L74 14 L80 38 L94 24 L92 48 L106 44 L98 72 Q90 52 60 52 Q32 52 22 72Z" fill="${h}" ${S()}/>`;
  } else if (o.style === 'bald') {
    front = `<path d="M23 82 Q16 62 28 54 Q26 68 33 76Z M97 82 Q104 62 92 54 Q94 68 87 76Z" fill="${h}" ${S(3)}/>`;
  } else if (o.style === 'tuft') {
    front = `<path d="M56 34 Q54 18 66 20 Q58 24 62 33" fill="none" stroke="${h}" stroke-width="5" stroke-linecap="round"/>`;
  } else {
    front = `<path d="M21 74 Q18 24 60 24 Q102 24 99 74 Q96 54 86 48 Q74 58 56 50 Q36 52 21 74Z" fill="${h}" ${S()}/>`;
  }
  const bt = o.bottomType, baby = o.type === 'baby';
  const legFill = bt === 'trousers' ? o.bottom : bt === 'onesie' ? o.top : (o.tights || sk);
  let lower = [43, 63].map(x => `<rect x="${baby ? x - 1 : x}" y="${lt}" width="${baby ? 16 : 14}" height="${lb - lt}" rx="6" fill="${legFill}" ${S()}/>`).join('');
  if (o.socks) lower += [43, 63].map(x => `<rect x="${x}" y="${lb - 18}" width="14" height="14" fill="${o.socks}" ${S(3)}/>`).join('');
  lower += `<ellipse cx="49" cy="${lb + 2}" rx="12" ry="7" fill="${o.shoes}" ${S()}/><ellipse cx="71" cy="${lb + 2}" rx="12" ry="7" fill="${o.shoes}" ${S()}/>`;
  if (bt === 'skirt') lower += `<path d="M36 ${tb - 10} L84 ${tb - 10} L92 ${tb + 22} Q60 ${tb + 30} 28 ${tb + 22}Z" fill="${o.bottom}" ${S()}/>`;
  if (bt === 'dress') lower += `<path d="M36 ${tb - 34} L84 ${tb - 34} L96 ${tb + 30} Q60 ${tb + 38} 24 ${tb + 30}Z" fill="${o.top}" ${S()}/>`;
  if (bt === 'shorts') lower += `<path d="M36 ${tb - 10} H84 L87 ${tb + 22} H64 L60 ${tb + 10} L56 ${tb + 22} H33Z" fill="${o.bottom}" ${S()}/>`;
  if (bt === 'trousers') lower += `<path d="M36 ${tb - 10} H84 L80 ${tb + 6} H40Z" fill="${o.bottom}" ${S()}/>`;
  const ay = f(114 + (tb - 114) * .35);
  const arm = d => `<path d="${d}" fill="none" stroke="${OL}" stroke-width="19" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${o.top}" stroke-width="11" stroke-linecap="round"/>`;
  let body = arm(`M40 114 Q26 ${ay} 27 ${tb - 6}`) + arm(`M80 114 Q94 ${ay} 93 ${tb - 6}`) +
    `<path d="M36 116 Q38 102 60 102 Q82 102 84 116 L88 ${tb} Q60 ${tb + 8} 32 ${tb}Z" fill="${o.top}" ${S()}/>`;
  if (o.collar) body += `<path d="M50 104 L60 117 L70 104Z" fill="${o.collar}" ${S(3)}/>`;
  if (o.buttons) {
    body += `<path d="M60 108 V${tb + 4}" stroke="${OL}" stroke-width="2.5"/>`;
    for (let y = 120; y < tb - 4; y += 20) body += `<circle cx="66" cy="${y}" r="3.5" fill="${o.buttons}" ${S(2)}/>`;
  }
  if (o.badge) body += `<circle cx="70" cy="132" r="7" fill="${o.badge}" ${S(3)}/>`;
  if (o.apron) body += `<path d="M48 104 L44 122 M72 104 L76 122" fill="none" stroke="${o.apron}" stroke-width="4"/><path d="M42 122 H78 L82 ${tb + 20} Q60 ${tb + 26} 38 ${tb + 20}Z" fill="${o.apron}" ${S(3)}/><rect x="50" y="${tb - 26}" width="20" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2.5" opacity=".7"/>`;
  body += `<circle cx="27" cy="${tb}" r="8" fill="${sk}" ${S()}/><circle cx="93" cy="${tb}" r="8" fill="${sk}" ${S()}/>`;
  let face = `<circle cx="60" cy="70" r="38" fill="${sk}" ${S()}/>` + front;
  if (o.earrings) face += `<circle cx="23" cy="88" r="4.5" fill="${o.earrings}" ${S(2)}/><circle cx="97" cy="88" r="4.5" fill="${o.earrings}" ${S(2)}/>`;

     <ellipse cx="74" cy="77" rx="4.5" ry="6" fill="#2a1d1d"/><circle cx="75.6" cy="74.4" r="1.7" fill="#fff"/>
     <circle cx="35" cy="89" r="6.5" fill="#ff7f7f" opacity=".42"/><circle cx="85" cy="89" r="6.5" fill="#ff7f7f" opacity=".42"/>
     <path d="M53 93 Q60 100 67 93" fill="none" ${S(3)}/>`;
  if (o.mustache) face += `<path d="M44 92 Q52 84 60 89 Q68 84 76 92 Q68 97 60 93 Q52 97 44 92Z" fill="${o.mustache}" ${S(2)}/>`;
  if (o.glasses) face += `<g fill="none" stroke="${o.glasses}" stroke-width="3.5"><circle cx="46" cy="77" r="11"/><circle cx="74" cy="77" r="11"/><path d="M57 76 H63"/></g>`;
  const ex = extras(o, tb);
  const out = svg(`-6 0 136 ${HH}`, ex.back + back + lower + body + face + ex.front);
  LOOKS.set(out, { ...o, fn: 'person' });
  return out;
}
